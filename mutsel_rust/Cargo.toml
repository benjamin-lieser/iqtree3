[package]
name = "mutsel_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
candle-core = "0.9.2"
candle-nn = "0.9.2"
lazy_static = "1.5.0"
phylo_grad = "2.4"
rayon = "1.11.0"
libc = "0.2.182"

[lib]
name = "mutsel_rust"
crate-type = ["staticlib"]

[profile.release]
lto = false # There seems to be an issue with LLVM which makes the code slower when using lto
panic = 'abort'

[profile.dev]
panic = 'abort'

