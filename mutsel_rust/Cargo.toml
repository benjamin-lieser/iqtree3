[package]
name = "mutsel_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
phylo_grad = { git = "https://github.com/soedinglab/phylo_grad", branch = "main" }
rayon = "1.11.0"
libc = "0.2.182"
nuts-rs = { git = "https://github.com/benjamin-lieser/nuts-rs", branch = "persistent-chain" }
thiserror = "2.0.20"
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }

[lib]
name = "mutsel_rust"
crate-type = ["staticlib", "rlib"]

[profile.release]
lto = false # There seems to be an issue with LLVM which makes the code slower when using lto
panic = 'abort'

[profile.dev]
panic = 'abort'

